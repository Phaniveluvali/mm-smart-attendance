apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mm-smart-attendance
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: mm-smart-attendance
spec:
  project: default
  source:
    repoURL: https://github.com/Phaniveluvali/mm-smart-attendance.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mm-smart-attendance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
