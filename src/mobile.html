<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E6B3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Smart Attendance – Muscat Municipality</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Reem+Kufi:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<style>
  /* no grey tap flash on buttons and the bottom bar in the installed app */
  * { -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  html, body { height: 100%; }
  body { background: #E4EAE7; overflow: hidden; font-size: 14.5px; }
  .phone { position: relative; width: 100%; height: 100dvh; background: #F7F9F8; overflow: hidden; display: flex; flex-direction: column; }
  @media (min-width: 560px) {
    body:not(.embed) { display: grid; place-items: center; min-height: 100vh; background: radial-gradient(1200px 700px at 30% 20%, #EEF3F0, #CFD9D4); }
    body:not(.embed) .phone { width: 400px; height: min(860px, calc(100vh - 32px)); border-radius: 46px; border: 11px solid #12161B; box-shadow: 0 30px 80px rgba(0,0,0,.28); }
  }
  body.embed { background: #F7F9F8; }
  .serif { font-family: 'Source Serif 4', Georgia, serif; }
  .screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 16px 22px; -webkit-overflow-scrolling: touch; }
  .card { border-radius: 14px; border-color: #E6EBE8; box-shadow: 0 1px 2px rgba(16,24,20,.04); }
  .eyebrow { font-size: 11.5px; letter-spacing: .08em; color: #5B6B63; }
  .sech { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 0 0 10px; color: var(--ink); }
  .sech .ic { color: var(--brand); }
  .sech .r { margin-inline-start: auto; font-size: 12.5px; font-weight: 600; color: var(--brand); }

  /* pills (same as portal) */
  .badge { gap: 6px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .badge.nodot::before { display: none; }
  .badge.ok { background: #E5F4EA; color: #0E7A43; } .badge.warn { background: #FEF0DC; color: #B54708; } .badge.bad { background: #FDE7E5; color: #D92D20; }
  .badge.info { background: #E7EEFB; color: #2E6FD8; } .badge.blue { background: #E7EEFB; color: #2E6FD8; } .badge.gray { background: #EEF1EF; color: #4B5563; }

  /* app bar (home) + top bar (inner screens) */
  .appbar, .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; margin: 0 -16px 14px; padding: 10px 16px; background: rgba(255,255,255,.97); border-bottom: 1px solid #E6EBE8; backdrop-filter: blur(6px); }
  .appbar .mmlogo, .appbar .mmlogo-img { height: 46px !important; width: auto !important; }
  .appbar .grow { flex: 1; }
  .abtn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); position: relative; }
  .abtn .dot2 { position: absolute; top: 4px; inset-inline-end: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: #E5322B; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid #fff; }
  .topbar h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; font-weight: 700; }
  .topbar .sub { font-size: 12px; color: var(--muted); }
  .iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid #E6EBE8; background: #fff; display: grid; place-items: center; flex: none; color: var(--ink); }
  .lang { border: 1px solid #DCE3DF; background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
  .langseg { display: inline-flex; gap: 10px; align-items: center; font-weight: 600; font-size: 13.5px; }
  .langseg button { border: 0; background: none; padding: 4px 2px; color: var(--ink-2); font-weight: 600; display: inline-flex; gap: 5px; align-items: center; }
  .langseg button.on { color: var(--brand); }
  .langseg i { width: 1px; height: 16px; background: #C9D1CD; }

  /* login */
  .lhero { position: relative; margin: 0 -16px; height: 300px; overflow: hidden; }
  .lhero .art, .lhero .art-photo { position: absolute; inset: 0; width: 100%; height: 100%; background: center/cover; }
  .lhero .in { position: relative; z-index: 1; padding: 16px 18px; }
  .lhero .lt { display: flex; justify-content: space-between; align-items: flex-start; }
  .lhero .mmlogo { width: 112px !important; }
  .lhero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.94) 0%, rgba(255,255,255,.86) 52%, rgba(255,255,255,0) 82%); }
  .lhero h2 { font-size: 21px; line-height: 1.15; margin: 16px 0 6px; letter-spacing: -.02em; color: #0F1F17; font-weight: 700; }
  .lhero p { margin: 0; color: #2B3A32; font-size: 13px; line-height: 1.45; max-width: 330px; }
  .lbox { position: relative; z-index: 2; margin-top: -64px; background: #fff; border-radius: 20px; box-shadow: 0 16px 44px rgba(15,31,23,.13); padding: 20px 18px 16px; }
  .lbox h3 { margin: 0; font-size: 22px; text-align: center; letter-spacing: -.02em; }
  .lbox .d { text-align: center; color: #4B5563; font-size: 13px; margin: 4px 0 16px; line-height: 1.45; }
  .fld { display: block; margin-bottom: 12px; }
  .fld > span { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--ink-2); }
  .fi { position: relative; }
  .fi .ic { position: absolute; top: 50%; inset-inline-start: 13px; transform: translateY(-50%); color: var(--muted); }
  .fi input { width: 100%; border: 1px solid #D3DAD6; border-radius: 11px; padding: 12px 14px 12px 42px; font-size: 15px; outline: none; background: #fff; }
  html[dir=rtl] .fi input { padding: 12px 42px 12px 14px; }
  .fi input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-50); }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 12px 0; font-size: 12.5px; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .softbtn { width: 100%; border: 0; background: #EEF1EF; border-radius: 12px; padding: 13px; font-weight: 600; font-size: 15px; display: flex; gap: 10px; justify-content: center; align-items: center; color: var(--ink); }
  .notice { margin-top: 14px; background: #EFF6F1; border-radius: 11px; padding: 10px 12px; display: flex; gap: 10px; font-size: 12px; color: #33413A; align-items: center; line-height: 1.45; }
  .notice .ic { color: var(--brand); flex: none; }
  .trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 14px 0 6px; }
  .trust span { background: #E5F4EA; color: #0E7A43; border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
  .trust span.bad { background: #FDE7E5; color: #D92D20; }
  .fine { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.5; margin: 8px 6px 0; }
  .lfoot { text-align: center; margin-top: 16px; color: #9A876F; font-size: 9.5px; letter-spacing: .38em; }
  .errbox { background: #FEF1EF; color: #B42318; border: 1px solid #F7CFCA; border-radius: 11px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: flex; gap: 8px; }

  /* home: My day (1 check in · 2 tasks · 3 check out) */
  .sech .r.muted2 { color: var(--muted); font-weight: 600; font-size: 12px; }
  .myday { padding: 6px 14px 8px; }
  .dstep { display: flex; gap: 12px; padding: 12px 0; position: relative; }
  .dstep + .dstep { border-top: 1px dashed #E1E7E3; }
  .dstep .dn { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: #EEF1EF; color: #6B7A72; }
  .dstep.cur .dn { background: var(--brand); color: #fff; box-shadow: 0 0 0 4px #E3F1E8; }
  .dstep.done .dn { background: #E5F4EA; color: #0E7A43; }
  .dstep .db { flex: 1; min-width: 0; }
  .dstep .db > b { display: flex; align-items: center; gap: 8px; font-size: 15px; letter-spacing: -.01em; }
  .dstep:not(.cur):not(.done) .db > b { color: #5B6B63; }
  .dstep .db > small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.45; margin-top: 2px; }
  .dstep .tbtns, .dstep .lockmsg { margin-top: 10px; }
  .dstep .lockmsg.sm { margin-bottom: 0; }
  .cnt-txt { font-size: 11.5px; font-weight: 700; color: var(--brand); background: #EAF3EE; border-radius: 99px; padding: 2px 8px; }
  .dprog { height: 6px; border-radius: 99px; background: #EEF1EF; overflow: hidden; margin: 10px 0 6px; }
  .dprog i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
  .dlist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 8px; }
  .drow { width: 100%; display: flex; align-items: center; gap: 9px; border: 1px solid #E6EBE8; background: #fff; border-radius: 12px; padding: 8px 10px; text-align: start; }
  .drow .dt { font-size: 12px; font-weight: 700; color: #33413A; font-variant-numeric: tabular-nums; width: 38px; flex: none; }
  .drow .di { width: 30px; height: 30px; border-radius: 9px; background: #EAF3EE; color: var(--brand); display: grid; place-items: center; flex: none; }
  .drow .dx { flex: 1; min-width: 0; }
  .drow .dx b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .dx small { display: flex; align-items: center; gap: 3px; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .dx small .badge { flex: none; font-size: 10.5px; padding: 1px 7px; margin-inline-end: 4px; }
  .drow .dx small { margin-top: 3px; }
  .drow .dgo { color: #A3B0A9; flex: none; }
  .drow, .tcard { cursor: pointer; }
  .tgo { flex: none; display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 99px; background: var(--brand); color: #fff; font: inherit; font-size: 12px; font-weight: 700; padding: 6px 11px; cursor: pointer; }
  .tgo.lg { margin-top: 10px; font-size: 13px; padding: 8px 14px; }
  .drow.later .tgo, .tcard.later .tgo { background: #E6EBE8; color: #4B5A52; }
  .tlock { flex: none; display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; background: #EEF1EF; color: #6B7A72; font-size: 11.5px; font-weight: 700; padding: 5px 10px; }
  .tlock.lg { margin-top: 10px; font-size: 12px; padding: 6px 12px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow.now { border-color: #8CC7A3; background: #F3FAF5; box-shadow: 0 0 0 3px #E3F1E8; }
  .drow.overdue { border-color: #F7CFCA; }
  .drow.done { opacity: .7; }
  .qstats.two { grid-template-columns: 1fr 1fr; }

  /* task screen + list */
  .tinfo { padding: 4px 14px; }
  .tr2 { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
  .tr2 + .tr2 { border-top: 1px solid var(--line); }
  .tr2 > .ic { color: var(--brand); margin-top: 2px; flex: none; }
  .tr2 > div { flex: 1; min-width: 0; }
  .tr2 small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .tr2 b { display: block; font-size: 14.5px; }
  .tr2 > .badge { flex: none; align-self: center; }
  .steps.s3 { grid-template-columns: repeat(3, 1fr); }
  .steps.s3 .c { font-weight: 800; font-size: 13px; color: #8A968F; }
  .steps.s3 .cur .c { color: var(--brand); }
  .steps small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .bottombar.withhint { flex-wrap: wrap; }
  .bhint { width: 100%; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: -2px; }
  .bhint .ic { color: var(--brand); flex: none; }
  .bottombar .btn.locked { flex: 1; }
  .tcard.now { border-color: #8CC7A3; box-shadow: 0 0 0 3px #E3F1E8; }
  .tcard.overdue { border-color: #F7CFCA; }
  .lockmsg.infob { width: 100%; border: 1px solid #CFE6D8; background: #EFF7F2; color: #145C35; text-align: start; margin: 0 0 12px; }

  /* login – photo background design (same as the web portal) */
  .screen.mlogin { padding: 0; background: #F6F3EC; display: flex; flex-direction: column; }
  .ml-hero { position: relative; min-height: 420px; flex: none; overflow: hidden; }
  .ml-bg { position: absolute; inset: 0; background: #E9E2D3 38% 100% / cover no-repeat; }
  .ml-veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,250,240,.95) 0%, rgba(255,250,240,.85) 34%, rgba(255,250,240,.25) 52%, rgba(255,250,240,0) 64%); }
  .ml-top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 18px 0; }
  .ml-top .mmlogo-img { height: 60px !important; }
  .ml-top .langseg button { color: #1F2A14; } .ml-top .langseg button.on { color: #3E5A17; }
  .ml-txt { position: relative; z-index: 1; padding: 10px 18px 0; }
  .ml-txt h1 { margin: 0; font-size: 27px; line-height: 1.08; letter-spacing: -.025em; font-weight: 800; color: #2C4512; }
  html[dir=rtl] .ml-txt h1 { font-size: 24px; line-height: 1.3; }
  .ml-txt h1 em { font-style: normal; color: #C8921A; }
  .ml-bar { display: block; width: 64px; height: 4px; border-radius: 4px; background: #C8921A; margin: 10px 0 10px; }
  .ml-txt p { margin: 0 0 14px; font-size: 13px; line-height: 1.45; color: #22301A; font-weight: 500; max-width: 330px; }
  .ml-feats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 340px; }
  .ml-feats > div { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
  .ml-feats span { width: 44px; height: 44px; border-radius: 13px; background: rgba(255,255,255,.94); display: grid; place-items: center; color: #3E5A17; box-shadow: 0 6px 14px rgba(60,48,20,.16); }
  .ml-feats b { font-size: 10.5px; font-weight: 700; line-height: 1.2; color: #1F2A14; text-shadow: 0 0 6px rgba(255,255,255,.9); }
  .ml-card { position: relative; z-index: 2; margin: -56px 14px 0; background: rgba(255,255,255,.97); border-radius: 24px; box-shadow: 0 18px 44px rgba(40,30,10,.2); padding: 20px 18px 16px; }
  .ml-card h3 { margin: 0; text-align: center; font-size: 24px; font-weight: 800; letter-spacing: -.02em; color: #2C4512; }
  .ml-card .d { text-align: center; color: #3B4636; font-size: 13px; margin: 4px 0 14px; }
  .ml-card .fld > span { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #1F2A14; }
  .ml-card .fi input { height: 48px; border-color: #D9DCD5; border-radius: 12px; }
  .ml-card .fi input:focus { border-color: #5B7A22; box-shadow: 0 0 0 3px rgba(91,122,34,.15); }
  .ml-signin { width: 100%; height: 50px; margin-top: 4px; border: 0; border-radius: 12px; background: linear-gradient(180deg, #557A1E, #36561A); color: #fff; font: inherit; font-size: 16.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 18px rgba(54,86,26,.28); }
  .ml-or { display: flex; align-items: center; gap: 12px; color: #1F2A14; font-weight: 600; font-size: 12.5px; margin: 12px 0; }
  .ml-or span { flex: 1; height: 1px; background: #D9DCD5; }
  .ml-face { width: 100%; height: 48px; border: 1px solid #E3E1DA; border-radius: 12px; background: #F1EFEA; font: inherit; font-size: 15px; font-weight: 600; color: #1F2A14; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .ml-card .trust { margin: 14px 0 0; }
  .ml-foot { margin-top: auto; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); margin-top: 16px; background: linear-gradient(90deg, #26400F, #3A5A18); color: #fff; font-size: 11.5px; text-align: center; }

  /* home hero */
  .mhero { position: relative; overflow: hidden; border-radius: 16px; background: #F3F6F4; border: 1px solid #E9EEEB; min-height: 132px; margin-bottom: 14px; }
  .mhero .art, .mhero .art-photo { position: absolute; inset: 0; width: 100%; height: 100%; background: center/cover; }
  html[dir=rtl] .mhero .art { transform: scaleX(-1); }
  .mhero .in { position: relative; z-index: 1; padding: 14px 16px; }
  .mhero .g { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; color: #26332C; }
  .mhero .n { font-family: 'Source Serif 4', Georgia, serif; font-size: 27px; line-height: 1.1; color: #0F1F17; margin: 1px 0 4px; }
  html[dir=rtl] .mhero .g, html[dir=rtl] .mhero .n { font-family: var(--font-ar); font-weight: 600; }
  .mhero .r { font-size: 12.5px; color: #33413A; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .meta span { display: inline-flex; gap: 5px; align-items: center; background: rgba(255,255,255,.88); border-radius: 99px; padding: 4px 9px; font-size: 11.5px; font-weight: 600; color: #26332C; }
  .meta .ic { color: var(--brand); }
  .offbar { background: #16241D; color: #fff; border-radius: 12px; padding: 10px 13px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; width: 100%; border: 0; text-align: start; margin-bottom: 12px; }
  .offbar .ic { color: #F5B544; } .offbar.sync .ic { color: #6EE7B7; }

  /* geofence card with map */
  .geo { overflow: hidden; }
  .mapslot { position: relative; height: 150px; background: #E8EDEA; }
  .mapslot .lmap { position: absolute; inset: 0; }
  .mapslot > svg { display: block; width: 100%; height: 100%; }
  .leaflet-container { font-family: var(--font); background: #E8EDEA; }
  .leaflet-control-attribution { font-size: 9px; }
  .mk-me { width: 18px; height: 18px; border-radius: 50%; background: #0E6B3E; border: 3px solid #fff; box-shadow: 0 0 0 7px rgba(14,107,62,.22); }
  .mk-me.bad { background: #D92D20; box-shadow: 0 0 0 7px rgba(217,45,32,.22); }
  .geo .info { padding: 11px 14px 12px; }
  .geo .st { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; box-shadow: 0 0 0 3px #E5F4EA; }
  .dot.bad { background: #D92D20; box-shadow: 0 0 0 3px #FDE7E5; } .dot.warn { background: #E89B22; box-shadow: 0 0 0 3px #FEF0DC; }
  .geo .meta2 { color: var(--muted); font-size: 12.5px; margin-top: 3px; }

  .shift { padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .shift .si { width: 42px; height: 42px; border-radius: 50%; background: #EAF3EE; color: var(--brand); display: grid; place-items: center; flex: none; }
  .shift .t { font-size: 15.5px; font-weight: 700; margin: 1px 0; }
  .shift .g { color: var(--muted); font-size: 12.5px; }
  .punch-wrap { display: grid; place-items: center; padding: 16px 0 2px; }
  .punch { width: 158px; height: 158px; border-radius: 50%; border: 0; background: linear-gradient(160deg, #15864D, #0A5530); color: #fff; box-shadow: 0 0 0 10px #E3F1E8, 0 14px 28px rgba(14,107,62,.28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; transition: transform .1s; text-align: center; line-height: 1.15; padding: 10px; }
  .punch:active { transform: scale(.97); }
  .punch.out { background: linear-gradient(160deg, #2D3B34, #16241D); box-shadow: 0 0 0 10px #E6EBE8, 0 14px 28px rgba(22,36,29,.25); }
  .last { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: #fff; border: 1px solid #E6EBE8; border-radius: 14px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-weight: 600; font-size: 12.5px; color: var(--ink); text-align: center; min-height: 92px; justify-content: center; box-shadow: 0 1px 2px rgba(16,24,20,.04); }
  .tile .ti { width: 42px; height: 42px; border-radius: 50%; background: #EAF3EE; color: var(--brand); display: grid; place-items: center; position: relative; }
  .tile .ti b { position: absolute; top: -4px; inset-inline-end: -6px; background: #E5322B; color: #fff; font-size: 10px; border-radius: 99px; padding: 0 5px; line-height: 16px; border: 2px solid #fff; }

  .cal .lg { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; margin-top: 10px; font-size: 11px; color: var(--muted); font-weight: 600; }

  .dsel { padding: 14px; margin-top: 12px; }
  .dh2 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

  /* ===== mobile design refresh (home screen design): navy primary, gold accents, soft white cards ===== */
