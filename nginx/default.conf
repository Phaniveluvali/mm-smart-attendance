server {
    listen 80;
    listen [::]:80;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/manifest+json image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Block hidden dotfiles (such as .image-version seed marker on the PV)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Ensure trailing slash for subpath hosting so relative assets resolve under /mmsmartattendance/
    location = /mmsmartattendance {
        return 301 /mmsmartattendance/;
    }

    # Strip /mmsmartattendance/ prefix internally when accessed behind Ingress
    rewrite ^/mmsmartattendance/(.*)$ /$1 last;

    # Compatibility redirect: portal.html was promoted to index.html in v1.0.3
    location = /portal.html {
        return 301 /mmsmartattendance/;
    }

    # Static deployment has no local PowerShell API server; 404 keeps js/core.js in browser localStorage mode
    location ^~ /api/ {
        return 404;
    }

    # Static pages & fallback (return 404 rather than /index.html so api/ver stays 404)
    location / {
        try_files $uri $uri/ =404;
    }

    # Web app manifest MIME type
    location ~* \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Stylesheets & JS (short cache with revalidation so temporary PV hot-edits reflect quickly)
    location ~* \.(css|js)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Images & Fonts Caching
    location ~* \.(png|jpg|jpeg|webp|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
