apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mm-smart-attendance-pvc
  namespace: mm-smart-attendance
  labels:
    app: mm-smart-attendance
    app.kubernetes.io/name: mm-smart-attendance
    app.kubernetes.io/part-of: mm-smart-attendance-platform
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
