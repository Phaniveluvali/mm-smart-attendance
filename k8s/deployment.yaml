apiVersion: apps/v1
kind: Deployment
metadata:
  name: mm-smart-attendance
  namespace: mm-smart-attendance
  labels:
    app: mm-smart-attendance
    app.kubernetes.io/name: mm-smart-attendance
    app.kubernetes.io/part-of: mm-smart-attendance-platform
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: mm-smart-attendance
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mm-smart-attendance
        app.kubernetes.io/name: mm-smart-attendance
    spec:
      containers:
      - name: nginx
        image: krishnaveluvali/mm-smart-attendance:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
